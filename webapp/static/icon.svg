<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40295c"/>
      <stop offset="0.55" stop-color="#6d3d74"/>
      <stop offset="1" stop-color="#b05a86"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3f8"/>
      <stop offset="1" stop-color="#f7bcd6"/>
    </linearGradient>
    <mask id="cres">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="318" cy="204" r="118" fill="#000"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 小さな星 -->
  <circle cx="130" cy="118" r="7" fill="#ffe1ee" opacity="0.95"/>
  <circle cx="392" cy="368" r="6" fill="#f2c4dd" opacity="0.9"/>
  <circle cx="352" cy="120" r="4.5" fill="#e9b7d9" opacity="0.8"/>
  <circle cx="118" cy="330" r="4.5" fill="#e9b7d9" opacity="0.75"/>

  <!-- きらめき（4方向の星） -->
  <path d="M404 176 l7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7 z" fill="#ffd9ea" opacity="0.95"/>
  <path d="M150 402 l5.5 17 17 5.5 -17 5.5 -5.5 17 -5.5 -17 -17 -5.5 17 -5.5 z" fill="#f3c3de" opacity="0.85"/>

  <!-- 三日月（ほんのり発光） -->
  <circle cx="240" cy="272" r="148" fill="url(#moon)" mask="url(#cres)" filter="url(#glow)"/>
</svg>
