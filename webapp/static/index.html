<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO-content-system</title>
<style>
  :root {
    color-scheme: dark;
    /* REVERSE：ダーク × オレンジ × ホワイト（配色のみ差し替え） */
    --bg: #1b1b22;                    /* 面（カード/パネル/入力/ヘッダー） */
    --text: #e6e8ee;                  /* 本文 */
    --heading: #f7f8fa;               /* 見出し（白） */
    --muted: #b4bac4;                 /* 補助テキスト */
    --light: #24242e;                 /* 左上のハイライト（面より明るいダーク） */
    --dark: #0c0c10;                  /* 右下の影（面より暗い） */
    --g1: #ff7a18;                    /* 主アクセント（オレンジ） */
    --g2: #ff9a4d;                    /* アクセント明（リンク/ホバー/強調） */
    --g3: #5aa9ff;                    /* 第2アクセント（青・区別用） */
    --accent: var(--g1);
    --grad: linear-gradient(135deg, #ff7a18, #ff9a4d);
    --grad3: linear-gradient(135deg, #ff7a18 0%, #ff9a4d 55%, #ff7a18 100%);
    --radius: 22px;
    --radius-sm: 14px;
    /* 凸（浮き出し） */
    --nm-out: -6px -6px 13px var(--light), 7px 7px 16px var(--dark);
    --nm-out-sm: -3px -3px 7px var(--light), 4px 4px 10px var(--dark);
    /* 凹（押し込み） */
    --nm-in: inset -3px -3px 7px var(--light), inset 4px 4px 9px var(--dark);
    --nm-in-deep: inset -4px -4px 9px var(--light), inset 5px 5px 11px var(--dark);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", -apple-system, sans-serif;
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    /* REVERSE：ほぼ黒 + 上部にオレンジのグロー */
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(255,122,24,0.16), transparent 70%),
      #0b0b0e;
    background-attachment: fixed;
  }

  header {
    position: relative;
    z-index: 5;
    padding: 14px 20px 2px;
    background: var(--bg);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
  }
  header h1 { font-size: 16px; font-weight: 800; letter-spacing: .2px; color: var(--heading); }
  header .badge {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 999px;
    padding: 4px 12px;
    box-shadow: var(--nm-in);
  }
  .spacer { flex: 1; }
  #model-select, #mode-select, #letter-select, #account-select {
    font-size: 12px;
    padding: 8px 13px;
    border: none;
    border-radius: 999px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    outline: none;
    font-family: inherit;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .15s;
  }
  #model-select:hover, #mode-select:hover, #letter-select:hover, #account-select:hover { box-shadow: var(--nm-out); }
  #model-select:focus, #mode-select:focus, #letter-select:focus, #account-select:focus { box-shadow: var(--nm-in); }
  #mode-select.danger { color: #d6584b; font-weight: 700; }
  /* ネイティブのドロップダウン候補（OSポップアップ）は白背景になりがち。
     暗背景＋白文字に固定して、白文字が白背景に溶けるのを防ぐ */
  select option, select optgroup {
    background: #1b1b22;
    color: #f7f8fa;
    font-weight: 600;
  }
  /* 現在のnoteアカウント＝目立つアクセント表示 */
  #account-select {
    font-weight: 800;
    color: #fff;
    background: var(--grad);
    box-shadow: -2px -2px 5px var(--light), 3px 3px 8px rgba(255,122,24,0.42);
  }

  /* ===== セッションタブ ===== */
  #tabbar {
    display: flex;
    align-items: center;
    gap: 9px;
    overflow-x: auto;
    scrollbar-width: thin;
    padding: 4px 2px 14px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px 8px 16px;
    font-size: 12.5px;
    background: var(--bg);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--muted);
    max-width: 210px;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .15s, color .15s, transform .12s;
  }
  .tab:hover { transform: translateY(-1px); box-shadow: var(--nm-out); color: var(--text); }
  .tab.active {
    background: var(--grad);
    color: #fff;
    font-weight: 700;
    box-shadow: -3px -3px 7px var(--light), 4px 4px 12px rgba(255,122,24,0.45);
  }
  .tab .title {
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 110px;
  }
  /* タブに紐づく output フォルダ名チップ（プロジェクト↔フォルダの関連を可視化） */
  .tab .folder {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,122,24,.14);
    color: var(--g2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab.active .folder { background: rgba(255,255,255,.28); color: #fff; }
  .tab .close {
    border: none;
    background: none;
    cursor: pointer;
    color: inherit;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    border-radius: 50%;
    opacity: .75;
  }
  .tab .close:hover { background: rgba(255,255,255,.3); opacity: 1; }
  .tab.add {
    padding: 8px 15px;
    font-weight: 800;
    color: var(--g2);
  }
  .tab.edit {
    padding: 8px 15px;
    font-weight: 800;
    color: var(--g3);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 26px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 84%;
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.78;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: rise .22s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: var(--grad);
    color: #fff;
    border-bottom-right-radius: 7px;
    box-shadow: -3px -3px 7px var(--light), 5px 5px 14px rgba(255,122,24,0.40);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bg);
    color: var(--text);
    border-bottom-left-radius: 7px;
    box-shadow: var(--nm-out);
  }
  .msg.assistant b { color: var(--g2); }
  .msg.assistant pre {
    background: var(--bg);
    color: var(--heading);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    overflow-x: auto;
    font-family: "SFMono-Regular", "Consolas", "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    margin: 9px 0;
    white-space: pre;
    box-shadow: var(--nm-in);
  }
  .msg.assistant code {
    background: var(--bg);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: "SFMono-Regular", "Consolas", monospace;
    font-size: 13px;
    box-shadow: var(--nm-in);
  }
  .msg.assistant pre code { background: none; padding: 0; box-shadow: none; }
  .status {
    align-self: flex-start;
    font-size: 12px;
    color: var(--muted);
    padding: 9px 15px;
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--bg);
    border-radius: 999px;
    box-shadow: var(--nm-out-sm);
  }
  .status .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 0 0 rgba(255,122,24,0.5);
    animation: pulse 1.3s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,122,24,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(255,122,24,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,122,24,0); }
  }

  #quickbar {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 12px;
    display: flex;
    gap: 11px;
    flex-wrap: wrap;
  }
  #quickbar button {
    font-size: 12.5px;
    padding: 9px 17px;
    border: none;
    background: var(--bg);
    border-radius: 999px;
    cursor: pointer;
    color: var(--text);
    font-weight: 700;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .12s, transform .12s, color .12s;
  }
  #quickbar button:hover { transform: translateY(-1px); box-shadow: var(--nm-out); color: var(--g2); }
  #quickbar button:active { box-shadow: var(--nm-in); transform: none; }

  #inputbar {
    padding: 16px 20px 20px;
    background: var(--bg);
    box-shadow: 0 -6px 14px rgba(0,0,0,0.28);
    position: relative;
    z-index: 3;
  }
  #inputbar .inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    resize: none;
    border: none;
    border-radius: 18px;
    padding: 13px 17px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 140px;
    outline: none;
    color: var(--text);
    background: var(--bg);
    box-shadow: var(--nm-in);
    transition: box-shadow .15s;
  }
  #input::placeholder { color: var(--muted); }
  /* 参考画像 添付ボタン */
  #attach-btn {
    flex: 0 0 auto;
    width: 48px;
    align-self: stretch;
    border: none;
    border-radius: 18px;
    background: var(--bg);
    color: var(--g2);
    font-size: 19px;
    cursor: pointer;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .12s, transform .12s;
  }
  #attach-btn:hover { box-shadow: var(--nm-out); transform: translateY(-1px); }
  #attach-btn:active { box-shadow: var(--nm-in); transform: none; }
  /* 添付チップ（送信前に表示） */
  #attach-chips {
    max-width: 900px;
    margin: 0 auto 9px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #attach-chips:empty { display: none; }
  .attach-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255,122,24,0.12);
    border: 1px solid rgba(255,122,24,0.4);
    border-radius: 999px;
    padding: 4px 6px 4px 11px;
  }
  .attach-chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 6px; }
  .attach-chip .x {
    border: none; background: none; cursor: pointer; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 0 4px; border-radius: 50%;
  }
  .attach-chip .x:hover { color: var(--g1); }
  #input:focus { box-shadow: var(--nm-in-deep); }
  #send {
    background: var(--grad);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 13px 26px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: -3px -3px 7px var(--light), 4px 4px 12px rgba(255,122,24,0.42);
    transition: box-shadow .12s, transform .12s, opacity .15s;
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); }
  #send:active:not(:disabled) { box-shadow: var(--nm-in); transform: none; }
  #send:disabled { opacity: .45; cursor: not-allowed; box-shadow: var(--nm-out-sm); }
  .ctl-btn {
    display: none;                 /* 既定は非表示。状況に応じてJSで表示 */
    font-size: 13px;
    font-weight: 800;
    border: none;
    border-radius: 18px;
    padding: 13px 18px;
    cursor: pointer;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .12s, color .12s;
  }
  .ctl-btn:hover { box-shadow: var(--nm-out); }
  .ctl-btn:active { box-shadow: var(--nm-in); }
  #stop { color: #d68b1e; }
  #cancel { color: #d6584b; }
  #resume { color: var(--g2); }

  /* スクロールバー */
  #chat::-webkit-scrollbar, #tabbar::-webkit-scrollbar { width: 9px; height: 9px; }
  #chat::-webkit-scrollbar-thumb, #tabbar::-webkit-scrollbar-thumb {
    background: var(--dark);
    border-radius: 999px;
    border: 2px solid var(--bg);
  }
  #chat::-webkit-scrollbar-track, #tabbar::-webkit-scrollbar-track { background: transparent; }

  /* ===== 裏メニュー：ナレッジ ===== */
  #kb-fab {
    position: fixed;
    right: 20px;
    bottom: 90px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 50%;
    cursor: pointer;
    background: var(--bg);
    box-shadow: var(--nm-out-sm);
    opacity: 0.5;                  /* 普段は控えめ */
    transition: opacity .2s, box-shadow .15s, transform .12s;
    z-index: 20;
    user-select: none;
  }
  #kb-fab:hover { opacity: 1; box-shadow: var(--nm-out); transform: translateY(-2px); }
  #kb-fab:active { box-shadow: var(--nm-in); }
  /* 📄 レターの型 FAB（📚の上に配置） */
  #lt-fab {
    position: fixed;
    right: 20px;
    bottom: 144px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 50%;
    cursor: pointer;
    background: var(--bg);
    box-shadow: var(--nm-out-sm);
    opacity: 0.5;
    transition: opacity .2s, box-shadow .15s, transform .12s;
    z-index: 20;
    user-select: none;
  }
  #lt-fab:hover { opacity: 1; box-shadow: var(--nm-out); transform: translateY(-2px); }
  #lt-fab:active { box-shadow: var(--nm-in); }
  #lt-panel {
    position: fixed;
    right: 20px;
    bottom: 202px;
    width: 248px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--nm-out);
    z-index: 21;
    animation: rise .18s ease both;
  }
  #lt-panel.hidden { display: none; }
  #lt-panel button {
    text-align: left;
    font-size: 13px;
    padding: 10px 13px;
    border: none;
    background: var(--bg);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .12s, color .12s;
  }
  #lt-panel button:hover { color: var(--g2); box-shadow: var(--nm-out); }
  #lt-panel button:active { box-shadow: var(--nm-in); }
  #kb-panel {
    position: fixed;
    right: 20px;
    bottom: 148px;
    width: 248px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--nm-out);
    z-index: 21;
    animation: rise .18s ease both;
  }
  #kb-panel.hidden { display: none; }
  .kb-head { font-size: 13px; font-weight: 800; color: var(--heading); display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .kb-head .kb-sub { font-size: 11px; font-weight: 500; color: var(--muted); }
  #kb-panel button {
    text-align: left;
    font-size: 13px;
    padding: 10px 13px;
    border: none;
    background: var(--bg);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    box-shadow: var(--nm-out-sm);
    transition: box-shadow .12s, color .12s;
  }
  #kb-panel button:hover { color: var(--g2); box-shadow: var(--nm-out); }
  #kb-panel button:active { box-shadow: var(--nm-in); }
  .kb-note { font-size: 10.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

  /* ===== プレビュー＆編集モーダル ===== */
  #pv-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  #pv-overlay.hidden { display: none; }
  #pv-modal {
    width: 100%;
    max-width: 920px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--nm-out);
    overflow: hidden;
    animation: rise .2s ease both;
  }
  #pv-bar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    flex-wrap: wrap;
    box-shadow: 0 5px 12px rgba(0,0,0,0.28);
  }
  #pv-bar select {
    font-size: 12px;
    padding: 7px 11px;
    border: none;
    border-radius: 999px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    outline: none;
    font-family: inherit;
    box-shadow: var(--nm-out-sm);
  }
  .pv-title { font-size: 13px; font-weight: 800; color: var(--heading); margin-right: 2px; }
  #pv-render .pv-meta {
    font-size: 11.5px; color: #8a90a0; line-height: 1.7;
    background: #f3f5f8; border: 1px dashed #d3d8e2; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 16px; font-family: "Consolas", monospace;
  }
  .pv-toggle { display: flex; gap: 5px; background: var(--bg); border-radius: 999px; padding: 3px; box-shadow: var(--nm-in); }
  .pv-toggle button {
    font-size: 12px;
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
  }
  .pv-toggle button.active { background: var(--bg); color: var(--g2); box-shadow: var(--nm-out-sm); }
  #pv-bar .spacer { flex: 1; }
  .pv-saved { font-size: 11.5px; color: var(--g1); font-weight: 700; }
  #pv-save {
    font-size: 12.5px; font-weight: 800; color: #fff;
    border: none; border-radius: 999px; padding: 8px 16px; cursor: pointer;
    background: var(--grad);
    box-shadow: -2px -2px 5px var(--light), 3px 3px 9px rgba(255,122,24,0.4);
  }
  #pv-save:active { box-shadow: var(--nm-in); }
  #pv-close {
    font-size: 14px; color: var(--text);
    border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer;
    background: var(--bg); box-shadow: var(--nm-out-sm);
  }
  #pv-close:active { box-shadow: var(--nm-in); }
  #pv-body { flex: 1; overflow: hidden; display: flex; }
  /* スマホ枠プレビュー */
  #pv-phone {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: 22px 16px;
  }
  #pv-render {
    width: 100%;
    max-width: 390px;
    height: max-content;
    background: #fff;
    border-radius: 26px;
    box-shadow: var(--nm-out);
    padding: 26px 20px 40px;
    color: #2b2f3a;
    font-size: 15px;
    line-height: 1.85;
  }
  #pv-render h1 { font-size: 21px; font-weight: 800; margin: 18px 0 10px; line-height: 1.4; color: #21252f; }
  #pv-render h2 { font-size: 18px; font-weight: 800; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #e7eaf0; color: #21252f; }
  #pv-render h3 { font-size: 16px; font-weight: 700; margin: 16px 0 8px; color: var(--g2); }
  #pv-render p { margin: 0 0 12px; }
  #pv-render ul { margin: 4px 0 14px; padding-left: 20px; }
  #pv-render li { margin: 3px 0; }
  #pv-render strong { color: #d2620a; font-weight: 800; }
  #pv-render hr { border: none; border-top: 1px dashed #cdd2dd; margin: 20px 0; }
  #pv-render blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid var(--g1); background: #f4f7f9; border-radius: 8px; color: #555c6e; }
  #pv-render code { background: #eef1f5; border-radius: 5px; padding: 1px 6px; font-family: "Consolas", monospace; font-size: 13.5px; }
  #pv-render .paywall { text-align: center; color: var(--g3); font-weight: 800; font-size: 13px; margin: 24px 0; padding: 10px; border-top: 1px dashed #cdd2dd; border-bottom: 1px dashed #cdd2dd; }
  /* 編集テキストエリア */
  #pv-edit {
    flex: 1;
    display: none;
    resize: none;
    border: none;
    outline: none;
    padding: 22px 24px;
    font-family: "SFMono-Regular", "Consolas", monospace;
    font-size: 13px;

  /* ===== フェーズ進捗カード ===== */
  /* ===== フェーズ進捗バー ===== */

  /* 完了した瞬間のポップアニメーション */

  @keyframes pcpop {

</head>

<script>
// ============================================================
// セッション（タブ）管理 — localStorage に保存
// ============================================================
const STORE_KEY = "acs_sessions_v1";
let state = loadState();   // { sessions: [{key, claudeId, title, createdAt, messages:[{role,text}]}], activeKey }
let busy = false;
let currentAbort = null;       // 実行中リクエストの中断用
let cancelRequested = false;   // キャンセル（取り消し）フラグ
let stepperPoll = null;        // 実行中のフェーズ進捗ポーリング

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const badge = document.getElementById("session-badge");
const tabbar = document.getElementById("tabbar");
const modelSelect = document.getElementById("model-select");
const modeSelect = document.getElementById("mode-select");
const letterSelect = document.getElementById("letter-select");
const accountSelect = document.getElementById("account-select");

// ===== noteアカウント（投稿先＋成果物の保存先を分ける単位） =====
let accountList = [];        // [{profile, name, folder}]
let currentAccount = null;   // 現在選択中のアカウント dict
const ADD_ACCOUNT = "__add__";
const DEL_ACCOUNT = "__delete__";

// アカウントの保存先フォルダ（projects/<folder>/…）。未取得時は null
function currentAccountFolder() { return currentAccount ? currentAccount.folder : null; }

// アカウント一覧を取得してプルダウンを描画。現在アカウントを currentAccount に反映
async function refreshAccountSelect() {
  try {
    const d = await (await fetch("/api/accounts")).json();
    accountList = d.accounts || [];
    currentAccount = accountList.find(a => a.profile === d.current) || accountList[0] || null;
  } catch (e) { return; }
  accountSelect.innerHTML =
    accountList.map(a => `<option value="${a.profile}">📣 ${a.name}</option>`).join("") +
    `<option value="${ADD_ACCOUNT}">＋ アカウントを追加…</option>` +
    // 2件以上のときだけ「現在のアカウントを削除」を出す（最後の1件は消せない）
    (accountList.length > 1 ? `<option value="${DEL_ACCOUNT}">🗑 このアカウントを削除…</option>` : "");
  if (currentAccount) accountSelect.value = currentAccount.profile;
}

accountSelect.addEventListener("change", async () => {
  if (busy) { alert("実行中はアカウントを切り替えられません。"); accountSelect.value = currentAccount ? currentAccount.profile : ""; return; }
  const val = accountSelect.value;
  if (val === ADD_ACCOUNT) {
    const name = prompt("追加するnoteアカウントの表示名を入力してください\n（例: サブ垢、ビジネス用 など）", "");
    accountSelect.value = currentAccount ? currentAccount.profile : "";
    if (name === null || !name.trim()) return;
    try {
      const res = await fetch("/api/accounts/add", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.trim() }),
      });
      const d = await res.json();
      if (!res.ok) { alert("追加に失敗: " + (d.error || "")); return; }
      await refreshAccountSelect();
      await syncFolderTabs();
      log(`👤 アカウント「${d.account.name}」を追加し、切り替えました（${d.account.profile}）。\n`
        + `このアカウントで note.com にログインするには、下の入力欄の指示をそのまま送信してください。`);
      // この新プロファイルで note ログインする指示を入力欄に用意（送信はユーザー操作）
      input.value = `noteアカウント「${d.account.name}」でログインしたいです。`
        + `python setup_note.py --profile "${d.account.profile}" を実行して、Chromeのログイン画面を開いてください。`;
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
      input.focus();
    } catch (e) { alert("追加に失敗しました: " + e.message); }
    return;
  }
  if (val === DEL_ACCOUNT) {
    accountSelect.value = currentAccount ? currentAccount.profile : "";
    if (!currentAccount) return;
    if (!confirm(`アカウント「${currentAccount.name}」を一覧から削除しますか？\n`
      + `※ note.comのアカウント自体は消えません。projects/${currentAccount.folder}/ の制作物は残ります（空のときだけフォルダも削除）。`)) return;
    try {
      const res = await fetch("/api/accounts/delete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile: currentAccount.profile }),
      });
      const d = await res.json();
      if (!res.ok) { alert("削除できません: " + (d.error || "")); return; }
      const removedName = d.removed ? d.removed.name : "";
      await refreshAccountSelect();
      await syncFolderTabs();
      log(`🗑 アカウント「${removedName}」を削除しました。現在は「${currentAccount ? currentAccount.name : ""}」です。`
        + (d.keptFolder ? `\n（projects/${d.removed.folder}/ に ${d.projectCount} 件のプロジェクトが残っています。不要ならエクスプローラーで削除してください）` : ""));
    } catch (e) { alert("削除に失敗しました: " + e.message); }
    return;
  }
  // 既存アカウントへ切替
  try {
    const res = await fetch("/api/accounts/current", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: val }),
    });
    const d = await res.json();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.sessions)) return s;
  } catch {}
  // デフォルトの空タブは作らない。起動後に syncFolderTabs() が projects/ から復元する
  return { sessions: [], activeKey: null };
}

// 起動時：projects/ 配下の既存フォルダをタブとして復元する。
// ・各フォルダ＝1タブ（localStorage に履歴があればそれを保持）
// ・紐づけも履歴も無い空タブ（旧「新しい会話」）は表示しない
async function syncFolderTabs() {
  const acct = currentAccountFolder();
  let folders = [];
  try {
    const q = acct ? "?account=" + encodeURIComponent(acct) : "";
    folders = (await (await fetch("/api/projects" + q)).json()).projects || [];
  } catch (e) {
    // サーバー未起動時は localStorage の内容だけで描画
    renderTabs(); renderChat(); return;
  }
  const have = new Set(state.sessions.filter(s => s.workdir).map(s => s.workdir));
  for (const f of folders) {
    if (have.has(f.folder)) continue;
    state.sessions.push({
      key: "f_" + f.folder, claudeId: null, title: f.name, customTitle: true,
      workdir: f.folder, account: f.account, workdirSent: false,
      createdAt: Date.now(), messages: [],
    });
  }
  // 旧1階層 projects/<名前>（アカウント無し）のタブは破棄。
  // 紐づけ無し かつ 履歴・セッションIDも無い空タブも除去。
  state.sessions = state.sessions.filter(s => {
    if (s.workdir && s.workdir.startsWith("projects/") && s.workdir.split("/").length !== 3) return false;
    return s.workdir || s.messages.length || s.claudeId;
  });
  // activeKey は「現在アカウントで表示されるタブ」の中に収める
  const vis = visibleSessions();
  if (!vis.find(s => s.key === state.activeKey)) {
    state.activeKey = vis.length ? vis[vis.length - 1].key : null;
  }
  saveState();
  renderTabs();
  renderChat();
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    // 容量オーバー時は最古のセッションを削って再試行
    if (state.sessions.length > 1) {
      state.sessions.shift();
      saveState();
    }
  }
}

// 現在のアカウントに属するタブだけを返す（workdir = projects/<アカウント>/<プロジェクト>）
function visibleSessions() {
  const acct = currentAccountFolder();
  return state.sessions.filter(s => {
    if (!s.workdir) return !acct;            // 未紐づけタブはアカウント未取得時のみ表示
    const parts = s.workdir.split("/");      // ["projects", account, project]
    return parts[0] === "projects" && parts[1] === acct;
  });
}

function activeSession() {
  const s = state.sessions.find(x => x.key === state.activeKey);
  if (s) return s;
  const vis = visibleSessions();
  return vis.length ? vis[vis.length - 1] : undefined;
}

function renderTabs() {
  tabbar.innerHTML = "";
  for (const s of visibleSessions()) {
    const tab = document.createElement("div");
    tab.className = "tab" + (s.key === state.activeKey ? " active" : "");
    tab.onclick = () => switchTab(s.key);
    tab.title = "ダブルクリックで名前を変更";
    tab.ondblclick = (e) => { e.stopPropagation(); renameTab(s.key); };
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = s.title;
    tab.appendChild(title);
    if (s.workdir) {
      const folder = document.createElement("span");
      folder.className = "folder";
      folder.textContent = "📁 " + s.workdir.split("/").pop();
      folder.title = "このプロジェクトの保存先フォルダ: " + s.workdir + "/";
      tab.appendChild(folder);
    }
    const close = document.createElement("button");
    close.className = "close";
    close.textContent = "×";
    close.title = "このタブを閉じる（履歴も削除）";
    close.onclick = (e) => { e.stopPropagation(); closeTab(s.key); };
    tab.appendChild(close);
    tabbar.appendChild(tab);
  }
  const add = document.createElement("div");
  add.className = "tab add";
  add.textContent = "＋ 新規";
  add.title = "新しいセッションを開始（output枝番フォルダを作成）";
  add.onclick = newSession;
  tabbar.appendChild(add);

  const edit = document.createElement("div");
  edit.className = "tab edit";
  edit.textContent = "✏️ 編集";
  edit.title = "既存の output フォルダを選んで成果物を編集";

  tabbar.appendChild(edit);
}

function switchTab(key) {
  if (busy) { alert("実行中はタブを切り替えられません。完了までお待ちください。"); return; }
  state.activeKey = key;
  clearAttachments();   // 別プロジェクトに切り替えたら添付はリセット
  saveState();
  renderTabs();
  renderChat();
  resetPhases();
}

async function newSession() {
  if (busy) { alert("実行中は新規セッションを開始できません。完了までお待ちください。"); return; }
  const acctLabel = currentAccount ? `（アカウント: ${currentAccount.name}）` : "";
  const name = prompt(`プロジェクト名を入力してください${acctLabel}\n（この名前で projects/<アカウント>/ 下にフォルダが作られます。空欄でも自動で名前が付きます）`, "");
  if (name === null) return; // キャンセル → 作成しない
  const trimmed = name.trim();
  // プロジェクト名から projects/<アカウント>/<名前>/ フォルダを作成（完全に新規スタート）
  let workdir = null, folderName = null, acctFolder = currentAccountFolder();
  try {
    const res = await fetch("/api/new-workfolder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: trimmed, account: acctFolder }),
    });
    const d = await res.json();
    if (res.ok) { workdir = d.folder; folderName = d.name; acctFolder = d.account; }
  } catch (e) { /* サーバー未起動時はフォルダ無しで続行 */ }
  const key = String(Date.now());
  state.sessions.push({
    key,
    claudeId: null,
    title: trimmed || folderName || "新しい会話",
    customTitle: !!trimmed,
    workdir: workdir,        // このセッション専用のワーキングフォルダ
    account: acctFolder,     // 所属アカウント（保存先フォルダ名）
    workdirSent: false,      // 初回メッセージでAIに伝えたか
    createdAt: Date.now(),
    messages: [],
  });
  state.activeKey = key;
  clearAttachments();
  saveState();
  renderTabs();
  renderChat();
  resetPhases();
  if (workdir) log(`📁 ワーキングフォルダ ${workdir}/ を作成しました（完全に新規スタート）`);
  input.focus();
}

async function renameTab(key) {
  const s = state.sessions.find(x => x.key === key);
  if (!s) return;
  if (busy) { alert("実行中は名前を変更できません。完了までお待ちください。"); return; }
  const name = prompt("新しいプロジェクト名を入力してください\n（保存先フォルダ名も連動して変わります）", s.title);
  if (name === null) return; // キャンセル → 変更しない
  const trimmed = name.trim();
  if (!trimmed) return;
  // フォルダに紐づくタブは、サーバー側で projects/<アカウント>/ 内のフォルダごとリネーム（連動）
  if (s.workdir) {
    try {
      const res = await fetch("/api/projects/rename", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dir: s.workdir, name: trimmed }),
      });
      const d = await res.json();
      if (!res.ok) { alert("フォルダ名の変更に失敗: " + (d.error || "")); return; }
      s.workdir = d.folder;   // 新しいフォルダパス
      s.title = d.name;       // タブ名＝フォルダ名（サニタイズ後）に合わせて完全連動
      s.customTitle = true;
      s.workdirSent = false;  // AIへ次回フォルダを伝え直す
      saveState();
      await syncFolderTabs();
      log(`✏️ プロジェクト名を「${d.name}」に変更しました（フォルダも連動）`);
    } catch (e) { alert("フォルダ名の変更に失敗しました: " + e.message); }
    return;
  }
  // 未紐づけタブ（フォルダ無し）はタブ名だけ変更
  s.title = trimmed;
  s.customTitle = true;
  saveState();
  renderTabs();
}

function closeTab(key) {
  if (busy) { alert("実行中はタブを閉じられません。"); return; }
  const s = state.sessions.find(x => x.key === key);
  if (s && s.messages.length && !confirm(`「${s.title}」を閉じますか？\nこのタブのチャット履歴は削除されます。`)) return;
  state.sessions = state.sessions.filter(x => x.key !== key);
  // 空になっても新しいタブは作らない（プロジェクト未選択の状態を許容）。
  // アクティブは「現在アカウントで表示されるタブ」の中から選ぶ
  if (state.activeKey === key) {
    const vis = visibleSessions();
    state.activeKey = vis.length ? vis[vis.length - 1].key : null;
  }
  saveState();
  renderTabs();
  renderChat();
  resetPhases();
}

// チャット描画

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(s) {
  let html = escapeHtml(s);
  html = html.replace(/```[a-z]*\n([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`);
  html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  return html;
}

function addBubble(cls, text, scroll = true) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (cls === "assistant") div.innerHTML = renderMarkdown(text);
  else div.textContent = text;
  chat.appendChild(div);
  if (scroll) chat.scrollTop = chat.scrollHeight;
  return div;
}

function setStatus(text) {
  let st = document.getElementById("status-line");
  if (!text) { if (st) st.remove(); return; }
  if (!st) {
    st = document.createElement("div");
    st.id = "status-line";
    st.className = "status";
    st.innerHTML = `<span class="dot"></span><span id="status-text"></span>`;
  }
  st.querySelector("#status-text").textContent = text;
  chat.appendChild(st); // 常に最下部へ
  chat.scrollTop = chat.scrollHeight;
}

function quick(text) {
  if (busy) return;
  input.value = text;
  send();
}

// ===== フェーズ進捗カード（完了ごとにカードが出現） =====
let phaseDone = {};   // 既に「完了」描画済みのフェーズ key → true（再アニメ防止）

function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function resetPhases() {
  phaseDone = {};
  document.getElementById("phasecards").innerHTML = "";
  refreshPhases(false);   // 切替時はポップさせず即時表示
}

async function refreshPhases(animate = true) {
  const session = activeSession();
  const q = (session && session.workdir) ? ("?dir=" + encodeURIComponent(session.workdir)) : "";
  let data;
  try { data = await (await fetch("/api/phase-status" + q)).json(); }
  catch (e) { return; }
  const el = document.getElementById("phasecards");
  const pp = document.getElementById("phaseprogress");
  if (!data.folder) { el.innerHTML = ""; phaseDone = {}; pp.classList.add("hidden"); return; }

  // 進捗バーを更新（完了フェーズ数 / 全6）
  const doneCount = data.phases.filter(p => p.done).length;
  const total = data.phases.length;
  const pct = Math.round((doneCount / total) * 100);
  document.getElementById("pp-fill").style.width = pct + "%";
  document.getElementById("pp-label").textContent =
    doneCount >= total ? "✅ 全6フェーズ完了" : `Phase ${doneCount}/${total}・${pct}%`;
  pp.classList.remove("hidden");
  pp.classList.toggle("running", busy && doneCount < total);

  data.phases.forEach((ph, i) => {
    const id = "pc-" + ph.key;
    let card = document.getElementById(id);
    const wasDone = !!phaseDone[ph.key];
    if (!card) {
      card = document.createElement("div");
      card.id = id;
      card.className = "pcard";
      el.appendChild(card);
    }
    const num = i + 1;
    if (ph.done) {
      const doPop = animate && !wasDone;
      const clickable = ph.path ? ` onclick="pvOpenPath('${ph.path}','${esc(ph.label)}',${ph.editable})"` : "";
      card.outerHTML =
        `<div id="${id}" class="pcard done${doPop ? " pop" : ""}"${clickable}>` +
          `<div class="pc-top"><span class="pc-no">${num}</span><span class="pc-check">✓</span></div>` +
          `<div class="pc-label">${esc(ph.label)}</div>` +
          `<div class="pc-excerpt">${esc(ph.excerpt)}</div>` +
          `<div class="pc-open">クリックで開く</div>` +
        `</div>`;
      if (!wasDone) {
        phaseDone[ph.key] = true;
        // narrator を出す（実行中に完了した時だけ）
        if (busy) log(`✅ ${ph.label} が完成しました`);
      }
    } else {
      card.className = "pcard";
      card.removeAttribute("onclick");
      card.innerHTML =
        `<div class="pc-top"><span class="pc-no">${num}</span><span class="pc-dot"></span></div>` +
        `<div class="pc-label">${esc(ph.label)}</div>` +
        `<div class="pc-excerpt pc-wait">待機中…</div>`;
    }
  });
}

// ===== プレビュー＆その場編集（本文 / ナレッジ共用） =====
let pvCurrentPath = null;
let pvDirty = false;
let pvSource = "content";   // "content"（output本文） | "knowledge"（ノウハウ）

function pvMd(src) {
  // プレビュー用の軽量Markdown→HTML
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = (s) => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // 先頭の frontmatter（--- … ---）はメタ情報ボックスとして表示
  let meta = "";
  if (src.startsWith("---")) {
    const end = src.indexOf("\n---", 3);
    if (end !== -1) {
      const fm = src.slice(3, end).replace(/^\n/, "").trim();
      meta = '<div class="pv-meta">' + fm.split("\n").map(l => esc(l)).join("<br>") + "</div>";
      src = src.slice(end + 4).replace(/^\n+/, "");
    }
  }
  const lines = src.split("\n");
  let html = "", inList = false, inCode = false, code = "";
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      if (inCode) { html += "<pre><code>" + esc(code) + "</code></pre>"; code = ""; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { code += line + "\n"; continue; }
    const t = line.trim();
    if (/有料エリア/.test(t) && t.startsWith("#")) { closeList(); html += '<div class="paywall">↓ ここから有料エリア ↓</div>'; continue; }
    if (/^###\s+/.test(t)) { closeList(); html += "<h3>" + inline(t.replace(/^###\s+/, "")) + "</h3>"; }
    else if (/^##\s+/.test(t)) { closeList(); html += "<h2>" + inline(t.replace(/^##\s+/, "")) + "</h2>"; }
    else if (/^#\s+/.test(t)) { closeList(); html += "<h1>" + inline(t.replace(/^#\s+/, "")) + "</h1>"; }
    else if (/^---+$/.test(t)) { closeList(); html += "<hr>"; }
    else if (/^>\s?/.test(t)) { closeList(); html += "<blockquote>" + inline(t.replace(/^>\s?/, "")) + "</blockquote>"; }
    else if (/^[-・*]\s+/.test(t)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(t.replace(/^[-・*]\s+/, "")) + "</li>"; }
    else if (t === "") { closeList(); }
    else { closeList(); html += "<p>" + inline(line) + "</p>"; }
  }
  if (inCode) html += "<pre><code>" + esc(code) + "</code></pre>";
  closeList();
  return meta + html;
}

function dbRowEl(r) {
  const pct = Math.round(r.done / r.total * 100);
  const row = document.createElement("div");
  row.className = "db-row";
  const statusSel = STATUS_OPTS.map(o =>
    `<option value="${o.v}"${o.v === r.status ? " selected" : ""}>${o.t}</option>`).join("");
  row.innerHTML =
    `<div class="db-row-top">`
    + `<span class="db-acct">📣 ${esc(r.accountName)}</span>`
    + `<span class="db-name">${esc(r.name)}</span>`
    + `<span class="db-prog"><span class="t"><span class="f" style="width:${pct}%"></span></span>`
    + `<span class="n">${r.done}/${r.total}</span></span>`
    + `</div>`
    + `<div class="db-row-meta">`
    + `<select class="db-status" title="投稿ステータス">${statusSel}</select>`
    + `<input class="price" placeholder="価格(円)" value="${esc(r.price)}">`
    + `<input class="url" placeholder="note URL" value="${esc(r.url)}">`
    + `<span class="db-act">`
    + `<button class="go">開く</button>`
    + `<button class="dup">複製</button>`
    + `<button class="ren">改名</button>`
    + `</span></div>`;
  const sel = row.querySelector(".db-status");
  const price = row.querySelector(".price");
  const url = row.querySelector(".url");
  const save = () => dbSaveMeta(r.folder, { status: sel.value, price: price.value, url: url.value });
  sel.onchange = save; price.onchange = save; url.onchange = save;
  row.querySelector(".go").onclick = () => dbOpenProject(r);
  row.querySelector(".dup").onclick = () => dbDuplicate(r);
  row.querySelector(".ren").onclick = () => dbRename(r);
  return row;
}

let pendingAttachments = [];   // [{path, name, url}]

async function onPickImages(inputEl) {
  const files = Array.from(inputEl.files || []);
  inputEl.value = "";   // 同じファイルを連続で選べるようにリセット
  if (!files.length) return;
  const session = activeSession();
  if (!session || !session.workdir) {
    alert("先に左上の「＋ 新規」でプロジェクトを作成してから画像を添付してください。");
    return;
  }
  for (const f of files) {
    try {
      const fd = new FormData();
      fd.append("file", f);
      fd.append("dir", session.workdir);
      const res = await fetch("/api/upload-image", { method: "POST", body: fd });
      const d = await res.json();
      if (!res.ok) { alert("画像の保存に失敗: " + (d.error || "")); continue; }
      pendingAttachments.push({ path: d.path, name: d.name, url: URL.createObjectURL(f) });
    } catch (e) { alert("画像の保存に失敗しました: " + e.message); }
  }
  renderAttachChips();
}

function renderAttachChips() {
  const box = document.getElementById("attach-chips");
  box.innerHTML = pendingAttachments.map((a, i) =>
    `<span class="attach-chip"><img src="${a.url}" alt=""><span>${a.name}</span>`
    + `<button class="x" onclick="removeAttachment(${i})" title="外す">×</button></span>`
  ).join("");
}

function removeAttachment(i) {
  const a = pendingAttachments[i];
  if (a && a.url) URL.revokeObjectURL(a.url);
  pendingAttachments.splice(i, 1);
  renderAttachChips();
}

function clearAttachments() {
  pendingAttachments.forEach(a => a.url && URL.revokeObjectURL(a.url));
  pendingAttachments = [];
  renderAttachChips();
}

async function send() {
  const message = input.value.trim();
  if ((!message && !pendingAttachments.length) || busy) return;

  const session = activeSession();
  if (!session) {
    alert("先に左上の「＋ 新規」でプロジェクトを作成してください。");
    return;
  }
  busy = true;
  cancelRequested = false;
  currentAbort = new AbortController();
  updateControls();
  clearInterval(stepperPoll);
  stepperPoll = setInterval(refreshStepper, 6000);   // 実行中は進捗を定期更新
  input.value = "";
  input.style.height = "auto";

  // 添付画像（送信時点で確定）。表示用テキストとAIへ渡すパスを用意
  const attached = pendingAttachments.slice();
  const shownText = message + (attached.length ? `\n📎 ${attached.map(a => a.name).join(", ")}` : "");

  // ユーザー発言を保存・描画
  session.messages.push({ role: "user", text: shownText });
  if (!session.customTitle && session.title === "新しい会話") {
    const t = message || (attached.length ? "画像を添付" : "");
    session.title = t.length > 14 ? t.slice(0, 14) + "…" : t;
    renderTabs();
  }
  saveState();
  addBubble("user", shownText);   // 画面にはユーザーの文＋添付名だけ表示
  setStatus("考え中...");

  // AIへ渡す本文を組み立て（表示はしない）
  let outbound = message || "添付した画像を確認してください。";
  // 添付画像があれば、Readで開いて参照するよう指示しパスを渡す
  if (attached.length) {
    const list = attached.map(a => "・" + a.path).join("\n");
    outbound = `【添付された参考画像（必ず Read ツールで開いて内容を確認してから、制作・回答に反映すること）】\n${list}\n\n` + outbound;
  }
  // このセッション専用フォルダがあれば、初回だけAIに伝える
  if (session.workdir && !session.workdirSent) {
    outbound = `【このセッションのワーキングフォルダは ${session.workdir}/ です。`
      + `Phase 0〜5 の制作物はすべて ${session.workdir}/ に保存し、`
      + `新しい output フォルダは作らないでください。】\n\n` + outbound;
    session.workdirSent = true;
    saveState();
  }
  clearAttachments();   // 送信したらチップをクリア

  let currentBubble = null;
  let currentText = "";

  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: currentAbort.signal,
      body: JSON.stringify({
        message: outbound,
        session_id: session.claudeId,
        model: modelSelect.value || null,
        mode: modeSelect.value || "restricted",
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      let msg = err.error || ("HTTP " + res.status);
      if (res.status === 403 && /フルオート/.test(msg)) {
        msg = "⚠️ フルオートは、今の起動方法では無効です。\n\n" +
              "**start_webapp.bat をダブルクリック**で起動し直すと有効になります。\n" +
              "今すぐ使いたい場合は、右上のモードを「自動（auto）」または「制限」に切り替えてください。";
      } else {
        msg = "⚠️ エラー: " + msg;
      }
      currentText += (currentText ? "\n\n" : "") + msg;
      if (!currentBubble) currentBubble = addBubble("assistant", "");
      currentBubble.innerHTML = renderMarkdown(currentText);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }

        if (ev.type === "session") {
          session.claudeId = ev.session_id;
          badge.textContent = "セッション: " + ev.session_id.slice(0, 8);
        } else if (ev.type === "text") {
          currentText += (currentText ? "\n\n" : "") + ev.text;
          if (!currentBubble) currentBubble = addBubble("assistant", "");
          currentBubble.innerHTML = renderMarkdown(currentText);
          setStatus("生成中...");
          chat.scrollTop = chat.scrollHeight;
        } else if (ev.type === "tool") {
          setStatus("🔧 " + (TOOL_LABELS[ev.name] || ev.name + " 実行中"));
        } else if (ev.type === "done") {
          session.claudeId = ev.session_id || session.claudeId;
          session.interrupted = false;
        } else if (ev.type === "error") {
          let msg = ev.message;
          if (/No conversation found|session/i.test(msg) && session.claudeId) {
            msg += "\n\n💡 このセッションはCLI側で期限切れの可能性があります（デフォルト30日で削除）。「＋ 新規」から新しいセッションを開始してください。";
          }
          currentText += (currentText ? "\n\n" : "") + "⚠️ エラー:\n" + msg;
          if (!currentBubble) currentBubble = addBubble("assistant", "");
          currentBubble.innerHTML = renderMarkdown(currentText);
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      if (!cancelRequested) {
        currentText += (currentText ? "\n\n" : "") + "⏹ 中断しました。「▶ 再開」で続きから再開できます。";
        session.interrupted = true;
        if (!currentBubble) currentBubble = addBubble("assistant", "");
        currentBubble.innerHTML = renderMarkdown(currentText);
      }
    } else {
      currentText += (currentText ? "\n\n" : "") + "⚠️ 通信エラー: " + e.message + "\nサーバー（start_webapp.bat）が起動しているか確認してください。";
      if (!currentBubble) currentBubble = addBubble("assistant", "");
      currentBubble.innerHTML = renderMarkdown(currentText);
    }
  } finally {
    currentAbort = null;
    if (cancelRequested) {
      // キャンセル：直前のユーザー発言と途中の返信を破棄して元に戻す
      if (session.messages.length && session.messages[session.messages.length - 1].role === "user") {
        session.messages.pop();
      }
      renderChat();
    } else if (currentText) {
      session.messages.push({ role: "assistant", text: currentText });
    }
    saveState();
    busy = false;
    setStatus(null);
    updateControls();
    clearInterval(stepperPoll);
    refreshStepper();   // フェーズ進捗を更新
    refreshLetterSelect();  // 型が追加された場合に反映
    if (!cancelRequested) input.focus();
  }
}

// ===== 中断 / 再開 / キャンセル =====
function updateControls() {
  const session = activeSession();
  const interrupted = !!(session && session.interrupted);
  // 送信は常に表示（実行中は無効化）。中断は送信の横に並べる
  sendBtn.style.display = "";
  sendBtn.disabled = busy;
  // 表示は明示的に "inline-block"（"" だと .ctl-btn の display:none に戻ってしまう）
  document.getElementById("stop").style.display = busy ? "inline-block" : "none";
  document.getElementById("cancel").style.display = "inline-block";   // 常に送信の隣に表示
  document.getElementById("resume").style.display = (!busy && interrupted) ? "inline-block" : "none";
}
function stopGen() {
  if (currentAbort) currentAbort.abort();
}
function cancelGen() {
  if (busy) {
    // 実行中：中断して直前のやり取りを取り消す
    cancelRequested = true;
    if (currentAbort) currentAbort.abort();
  } else {
    // 待機中：入力欄をクリア
    input.value = "";
    input.style.height = "auto";
    input.focus();
  }
}
function resumeGen() {
  if (busy) return;
  const session = activeSession();
  if (session) session.interrupted = false;
  input.value = "中断したところから続けて、最後まで完了させてください。";
  send();
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

// 初期描画：アカウント取得 → そのアカウントの projects/ フォルダをタブ復元（空のデフォルトタブは作らない）
renderTabs();
refreshAccountSelect()
  .then(() => syncFolderTabs())
  .then(() => { refreshStepper(); });
refreshLetterSelect();
input.focus();
</script>
