<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショート動画メーカー — 2〜10秒の告知動画をブラウザだけで作成</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎬 ショート動画メーカー</div>
  <div class="tagline">2〜10秒のSNS告知動画をブラウザだけで作成・書き出し</div>
</header>

<main class="layout">

  <!-- ============ 左：設定パネル ============ -->
  <aside class="panel">

    <section class="group">
      <h2>基本設定</h2>
      <label class="row">
        <span>アスペクト比</span>
        <select id="aspect">
          <option value="9:16" selected>縦 9:16（ショート / リール / TikTok）</option>
          <option value="1:1">正方形 1:1（フィード投稿）</option>
          <option value="16:9">横 16:9（YouTube / X）</option>
        </select>
      </label>
      <label class="row">
        <span>動画の長さ <b id="durationLabel">5.0秒</b></span>
        <input type="range" id="duration" min="2" max="10" step="0.5" value="5">
      </label>
    </section>

    <section class="group">
      <h2>テキスト</h2>
      <label class="row">
        <span>メインテキスト（改行OK）</span>
        <textarea id="mainText" rows="3">新作noteを
リリースしました</textarea>
      </label>
      <label class="row">
        <span>サブテキスト</span>
        <input type="text" id="subText" value="プロフィールのリンクからどうぞ">
      </label>
      <label class="row">
        <span>バッジ（空欄で非表示）</span>
        <input type="text" id="badgeText" value="🎉 NEW RELEASE">
      </label>
      <div class="row2">
        <label class="row half">
          <span>フォント</span>
          <select id="font">
            <option value="gothic" selected>ゴシック</option>
            <option value="mincho">明朝</option>
            <option value="rounded">丸ゴシック</option>
          </select>
        </label>
        <label class="row half">
          <span>文字サイズ <b id="fontSizeLabel">64</b></span>
          <input type="range" id="fontSize" min="28" max="110" step="2" value="64">
        </label>
      </div>
      <div class="row2">
        <label class="row half">
          <span>文字色</span>
          <input type="color" id="textColor" value="#ffffff">
        </label>
        <label class="row half">
          <span>テキストの動き</span>
          <select id="textAnim">
            <option value="fade">フェードイン</option>
            <option value="slideup" selected>下からスライド</option>
            <option value="zoom">ズームイン</option>
            <option value="pop">ポップ（弾む）</option>
            <option value="typewriter">タイプライター</option>
            <option value="none">なし</option>
          </select>
        </label>
      </div>
    </section>

    <section class="group">
      <h2>背景</h2>
      <div class="bgtabs" role="tablist">
        <label><input type="radio" name="bgType" value="gradient" checked><span>グラデ</span></label>
        <label><input type="radio" name="bgType" value="solid"><span>単色</span></label>
        <label><input type="radio" name="bgType" value="image"><span>画像</span></label>
      </div>
      <div id="gradientPane">
        <div class="swatches" id="swatches"></div>
      </div>
      <div id="solidPane" hidden>
        <label class="row"><span>背景色</span><input type="color" id="solidColor" value="#111827"></label>
      </div>
      <div id="imagePane" hidden>
        <label class="row">
          <span>画像を選択（端末内で処理・アップロードなし）</span>
          <input type="file" id="bgImage" accept="image/*">
        </label>
        <div class="hint" id="imageHint">未選択</div>
      </div>
      <label class="row">
        <span>背景の動き</span>
        <select id="bgMotion">
          <option value="zoom" selected>ゆっくりズーム</option>
          <option value="pan">グラデーション移動</option>
          <option value="particles">パーティクル（光の粒）</option>
          <option value="none">なし</option>
        </select>
      </label>
      <label class="row">
        <span>暗さオーバーレイ（文字を読みやすく） <b id="scrimLabel">20%</b></span>
        <input type="range" id="scrim" min="0" max="70" step="5" value="20">
      </label>
    </section>

    <section class="group">
      <h2>仕上げ</h2>
      <label class="check"><input type="checkbox" id="progressBar" checked> 下部に進捗バーを表示</label>
      <label class="check"><input type="checkbox" id="fadeOut" checked> 最後にフェードアウト</label>
    </section>

  </aside>

  <!-- ============ 右：プレビュー & 書き出し ============ -->
  <section class="stage">
    <div class="canvasWrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="transport">
      <button id="playBtn" class="btn" title="再生 / 一時停止">⏸</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="time" id="timeLabel">0.0 / 5.0s</span>
    </div>

    <div class="exportRow">
      <button id="exportBtn" class="btn primary">⬇️ 動画を書き出す</button>
      <div class="exportStatus" id="exportStatus">形式はブラウザに合わせて自動選択（MP4 / WebM）</div>
    </div>
    <div class="exportProgress" id="exportProgress" hidden>
      <div class="bar"><div class="fill" id="exportFill"></div></div>
      <span id="exportPct">0%</span>
    </div>
  </section>

</main>

<footer class="foot">
  すべてブラウザ内で完結します。テキスト・画像が外部に送信されることはありません。
</footer>

<script src="app.js"></script>
</body>
</html>
