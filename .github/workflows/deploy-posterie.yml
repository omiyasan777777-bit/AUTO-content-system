name: Deploy POSTERIE to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/rakuten-affiliate-post-gen-36dm9o
    paths:
      - "rakuten-post-app/**"
      - ".github/workflows/deploy-posterie.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish rakuten-post-app to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rakuten-post-app
          publish_branch: gh-pages
          commit_message: "Deploy POSTERIE"
